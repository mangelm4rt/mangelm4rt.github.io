<svg width="200" height="350" viewBox="0 0 200 350" xmlns="http://www.w3.org/2000/svg" style="background-color: #fff;">
  <!-- Título del acorde -->
  <text x="100" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="black">A</text>

  <!-- Fondo de madera oscura para el diapasón  -->
  <rect x="32" y="70" width="136" height="250" fill="#7D573E" />

  <!-- Cejuela superior de hueso/crema -->
  <rect x="32" y="70" width="136" height="6" fill="#E1D3B8" stroke="none"/>

  <!-- Símbolos superiores (X y O) claros sobre el fondo de madera oscura -->
  <!-- X sobre la cuerda 6 (E6) -->
  <line x1="32" y1="46" x2="48" y2="62" stroke="black" stroke-width="4" stroke-linecap="round"/>
  <line x1="48" y1="46" x2="32" y2="62" stroke="black" stroke-width="4" stroke-linecap="round"/>
  <!-- O sobre la cuerda 5 (A5) -->
  <circle cx="64" cy="54" r="7" stroke="black" stroke-width="2.5" fill="none"/>
  <!-- O sobre la cuerda 1 (E1) -->
  <circle cx="160" cy="54" r="7" stroke="black" stroke-width="2.5" fill="none"/>

  <!-- Trastes -->
  <line x1="40" y1="120" x2="160" y2="120" stroke="#E1D3B8" stroke-width="2"/>
  <line x1="40" y1="170" x2="160" y2="170" stroke="#E1D3B8" stroke-width="2"/>
  <line x1="40" y1="220" x2="160" y2="220" stroke="#E1D3B8" stroke-width="2"/>
  <line x1="40" y1="270" x2="160" y2="270" stroke="#E1D3B8" stroke-width="2"/>
  <line x1="40" y1="320" x2="160" y2="320" stroke="#E1D3B8" stroke-width="2"/>

  <!-- Cuerdas blancas/claras(6 para la guitarra A) -->
  <line x1="40" y1="70" x2="40" y2="320" stroke="#CDD2E0" stroke-width="1.9"/>
  <line x1="64" y1="70" x2="64" y2="320" stroke="#CDD2E0" stroke-width="1.8"/>
  <line x1="88" y1="70" x2="88" y2="320" stroke="#CDD2E0" stroke-width="1.7"/>
  <line x1="112" y1="70" x2="112" y2="320" stroke="#CDD2E0" stroke-width="1.6"/>
  <line x1="136" y1="70" x2="136" y2="320" stroke="#CDD2E0" stroke-width="1.5"/>
  <line x1="160" y1="70" x2="160" y2="320" stroke="#CDD2E0" stroke-width="1.5"/>

  <!-- Números de los trastes claros sobre el diapasón oscuro -->
  <text x="25" y="195" text-anchor="end" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="black">3</text>
  <text x="25" y="295" text-anchor="end" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="black">5</text>

  <!-- Puntos de incrustación perla  -->
  <circle cx="100" cy="195" r="5" fill="#9FA2AD"/>
  <circle cx="100" cy="295" r="5" fill="#9FA2AD"/>
  
  <!-- Dedo 1: Traste 2, Cuerda 4 (D4) -->
  <circle cx="88" cy="145" r="11" fill="black"/>
  <text x="88" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">1</text>
  
  <!-- Dedo 2: Traste 2, Cuerda 3 (G3) -->
  <circle cx="112" cy="145" r="11" fill="black"/>
  <text x="112" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">2</text>
  
  <!-- Dedo 3: Traste 2, Cuerda 2 (B2) -->
  <circle cx="136" cy="145" r="11" fill="black"/>
  <text x="136" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">3</text>
</svg>
